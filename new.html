<!DOCTYPE html>
<html lang="en">
<head>
    

    
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .head{
            text-align: center;
            background-color: black;
            width: 100%;
            height: 25px;
            color: white;
            
            
        }
        .head2{
            background-color: rgba(27, 28, 28, 0.384);
            width: 100%;
            height: 40px;
            text-align: left;
            display: flex;
            gap: 20px;
            
        }
        .msg{
            position: relative;
        }
        .aaa{
            background-color: red;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            text-align: center;
            position: absolute;
            right: 60px;
            left: 60px;
            bottom: 10px;
        }
    </style>
</head>

<body>
<div class="head">
    <p>email:example@email.com
    phone:1234567890</p>
</div>
<div class="head2">
    <p>home</p>
    <p>services</p>
    <p>about</p>
    <p>contact</p>
    <div class="msg">messages <p class="aaa">5</p></div>
   
</div>

</body>
</html>
